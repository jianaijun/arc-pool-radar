[project]
name = "arc-pool-radar"
version = "0.1.0"
description = "Is this Arc pool what it claims to be, and is its price worth believing?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Deliberately empty. Everything here is standard library, so a reviewer can read the whole package
# without resolving anything, and it cannot rot when a dependency does.
dependencies = []

[project.urls]
Repository = "https://github.com/jianaijun/arc-pool-radar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcradar"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
